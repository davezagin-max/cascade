id = "code-topo-order"
title = "Smallest topological order"
difficulty = 3
prompt = '''
Write a Python function `topo_order(n: int, edges: list[tuple[int, int]]) -> list[int]`.
The nodes are 0 to n-1 and an edge `(a, b)` means a must come before b. Return the
lexicographically smallest ordering of all nodes that respects every edge, or an empty
list if the graph has a cycle. Edges may repeat.
'''
reference = '''
```python
import heapq

def topo_order(n: int, edges: list[tuple[int, int]]) -> list[int]:
    followers = [[] for _ in range(n)]
    indegree = [0] * n
    for a, b in edges:
        followers[a].append(b)
        indegree[b] += 1
    ready = [node for node in range(n) if indegree[node] == 0]
    heapq.heapify(ready)
    order = []
    while ready:
        node = heapq.heappop(ready)
        order.append(node)
        for nxt in followers[node]:
            indegree[nxt] -= 1
            if indegree[nxt] == 0:
                heapq.heappush(ready, nxt)
    return order if len(order) == n else []
```
