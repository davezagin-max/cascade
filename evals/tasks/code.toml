[[task]]
id = "code-lru-cache"
title = "LRU cache"
difficulty = 3
prompt = '''
Write a Python class `LRUCache` with:

- `__init__(self, capacity: int)`: capacity is at least 1.
- `get(self, key)`: return the value for `key`, or -1 if it is absent. A hit makes the key
  the most recently used.
- `put(self, key, value)`: insert or update. Updating an existing key also makes it the
  most recently used and never evicts anything. Inserting a new key into a full cache
  first evicts the least recently used key.

Both operations should run in O(1) time on average.
'''
reference = '''
```python
from collections import OrderedDict

class LRUCache:
    def __init__(self, capacity: int):
        self.capacity = capacity
        self.items: OrderedDict = OrderedDict()

    def get(self, key):
        if key not in self.items:
            return -1
        self.items.move_to_end(key)
        return self.items[key]

    def put(self, key, value):
        if key in self.items:
            self.items.move_to_end(key)
        elif len(self.items) >= self.capacity:
            self.items.popitem(last=False)
        self.items[key] = value
```
'''
wrong = '''
```python
class LRUCache:
    def __init__(self, capacity: int):
        self.capacity = capacity
        self.items = {}

    def get(self, key):
        return self.items.get(key, -1)

    def put(self, key, value):
        if key not in self.items and len(self.items) >= self.capacity:
            oldest = next(iter(self.items))
            del self.items[oldest]
        self.items[key] = value
```
