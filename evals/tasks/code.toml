id = "code-compare-versions"
title = "Semantic version precedence"
difficulty = 4
prompt = '''
Write a Python function `compare_versions(a: str, b: str) -> int` that returns -1, 0 or 1
according to semantic-version precedence.

- A version is MAJOR.MINOR.PATCH, optionally followed by "-" and a pre-release made of
  dot-separated identifiers, optionally followed by "+" and build metadata.
- MAJOR, MINOR and PATCH compare numerically.
- A version with a pre-release is lower than the same version without one.
- Pre-releases compare identifier by identifier: numeric identifiers compare numerically,
  others compare as ASCII strings, a numeric identifier is lower than a non-numeric one,
  and if all shared identifiers are equal the shorter pre-release is lower.
- Build metadata is ignored.
'''
reference = '''
```python
def compare_versions(a: str, b: str) -> int:
    def parse(version: str):
        version = version.split("+", 1)[0]
        core, _, pre = version.partition("-")
        numbers = tuple(int(part) for part in core.split("."))
        return numbers, (pre.split(".") if pre else [])

    def cmp(x, y) -> int:
        return (x > y) - (x < y)

    core_a, pre_a = parse(a)
    core_b, pre_b = parse(b)
    if core_a != core_b:
        return cmp(core_a, core_b)
    if not pre_a or not pre_b:
        return cmp(bool(pre_b), bool(pre_a))
    for x, y in zip(pre_a, pre_b):
        if x == y:
            continue
        if x.isdigit() and y.isdigit():
            return cmp(int(x), int(y))
        if x.isdigit() != y.isdigit():
            return -1 if x.isdigit() else 1
        return cmp(x, y)
    return cmp(len(pre_a), len(pre_b))
```
'''
