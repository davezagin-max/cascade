id = "code-evaluate"
title = "Integer expression evaluator"
difficulty = 5
prompt = '''
Write a Python function `evaluate(expression: str) -> int` that evaluates an integer
arithmetic expression without using `eval`, `exec` or `ast`.

- Tokens: non-negative integer literals, the binary operators + - * /, unary minus,
  parentheses, and spaces (which are ignored between tokens).
- Precedence is the usual one: unary minus binds tightest, then * and /, then + and -.
  Binary operators are left-associative. Unary minus may be repeated ("--4" is 4).
- `/` is integer division that truncates toward zero: 7 / 2 is 3 and -7 / 2 is -3.
- Dividing by zero raises ZeroDivisionError.
- Any malformed expression, including an empty one or an unsupported operator, raises
  ValueError.
'''
reference = '''
```python
def evaluate(expression: str) -> int:
    tokens = []
    i = 0
    while i < len(expression):
        ch = expression[i]
        if ch == " ":
            i += 1
        elif ch.isdigit():
            j = i
            while j < len(expression) and expression[j].isdigit():
                j += 1
            tokens.append(int(expression[i:j]))
            i = j
        elif ch in "+-*/()":
            tokens.append(ch)
