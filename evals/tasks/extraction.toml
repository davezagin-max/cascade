{"type": "object", "additionalProperties": false,
 "required": ["invoice_number", "date", "net_amount", "vat_percent"],
 "properties": {"invoice_number": {"type": "string"},
                "date": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
                "net_amount": {"type": "number"}, "vat_percent": {"type": "number"}}}
'''
expected = '''
{"invoice_number": "2291", "date": "2026-03-14", "net_amount": 1234.56, "vat_percent": 19}
'''

[[task]]
id = "ext-server-inventory"
title = "Inventory with mixed memory units"
difficulty = 3
prompt = '''
Extract the servers that are still in service as JSON: servers, a list of objects with the keys host, region, and memory_gb (number), in any order.

"We run three boxes today. atlas-01 sits in eu-west with 64 GB of RAM. The cache node, brisk-02, is in us-east and only has 512 MB. cinder-03 (ap-south, 32 GB) was decommissioned last week and is listed here only for the audit trail. Its replacement, cinder-04, went live in ap-south yesterday with 128 GB."
'''
wrong_patch = '{"servers": [{"host": "atlas-01", "region": "eu-west", "memory_gb": 64}, {"host": "brisk-02", "region": "us-east", "memory_gb": 512}, {"host": "cinder-04", "region": "ap-south", "memory_gb": 128}]}'
[task.grader]
type = "json"
unordered = ["servers"]
schema = '''
{"type": "object", "additionalProperties": false, "required": ["servers"],
 "properties": {"servers": {"type": "array", "items": {"type": "object",
   "additionalProperties": false, "required": ["host", "region", "memory_gb"],
   "properties": {"host": {"type": "string"}, "region": {"type": "string"},
                  "memory_gb": {"type": "number"}}}}}}
'''
expected = '''
{"servers": [{"host": "atlas-01", "region": "eu-west", "memory_gb": 64},
             {"host": "brisk-02", "region": "us-east", "memory_gb": 0.5},
             {"host": "cinder-04", "region": "ap-south", "memory_gb": 128}]}
'''

[[task]]
id = "ext-thread-corrections"
title = "Final values from an email thread"
difficulty = 4
prompt = '''
Read this email thread, oldest message first, and extract the plan as it stands after the last message. Return JSON with the keys project, owner, budget_usd (integer), and deadline (YYYY-MM-DD).

[1] From Ines: "Kicking off Project Lantern. Budget is $40k, Rafael owns it, and we ship by 30 June 2026."
[2] From Rafael: "Happy to own it. One flag: June 30 is tight. Could we have two more weeks?"
[3] From Ines: "No to the extension, sorry. Correction on money though: finance approved 46, not 40."
[4] From Rafael: "Understood. I'm on leave from the 8th, so Suki will take over as owner from today. I'll stay on as an advisor."
[5] From Suki: "Confirmed, I've got it. Nothing else changes."
'''
wrong_patch = '{"owner": "Rafael", "deadline": "2026-07-14"}'
[task.grader]
type = "json"
schema = '''
{"type": "object", "additionalProperties": false,
 "required": ["project", "owner", "budget_usd", "deadline"],
 "properties": {"project": {"type": "string"}, "owner": {"type": "string"},
                "budget_usd": {"type": "integer"},
                "deadline": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"}}}
'''
expected = '''
{"project": "Project Lantern", "owner": "Suki", "budget_usd": 46000, "deadline": "2026-06-30"}
'''

