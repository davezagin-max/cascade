 "properties": {"start_date": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
                "end_date": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
                "notice_deadline": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
                "monthly_rent": {"type": "number"}}}
'''
