Extract these fields from the German invoice line as JSON: invoice_number (string), date (YYYY-MM-DD), net_amount (number), and vat_percent (number).

"Rechnung Nr. 2291 vom 14. März 2026. Nettobetrag: 1.234,56 € zzgl. 19 % MwSt. Zahlbar innerhalb von 30 Tagen."
'''
