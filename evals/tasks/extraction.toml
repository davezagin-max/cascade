{"start_date": "2025-02-03", "end_date": "2026-08-31", "notice_deadline": "2026-07-02",
 "monthly_rent": 1450}
'''

[[task]]
id = "ext-manifest-row"
title = "One row from a messy shipping manifest"
difficulty = 5
prompt = '''
Below is OCR text from a shipping manifest. Extract only the container MSKU 448120-7 as JSON with the keys container (as printed), weight_kg (integer, rounded to the nearest kilogram), seals (list of strings, in the order printed), eta (YYYY-MM-DD), and dangerous_goods (boolean). One pound is 0.45359237 kg.

MANIFEST 7731 / VESSEL: NORDIC WREN / ROTTERDAM dep. 2026-05-30
CNTR          GROSS WT     SEALS              ETA                 DG
MSKU 448102-7 18,650 kg    A7741              2026-06-02          N
MSKU 448120-7 18,700 lb    B2210 / B2211      day after dep.      see note 2
TCLU 448120-1 9,120 kg     C0090              2026-06-02          Y (UN1993)
note 1: weights in kg unless marked.
note 2: no DG declared for this unit; note 3 applies to TCLU units only.
note 3: flammable liquid, class 3.
'''
wrong_patch = '{"weight_kg": 18700, "dangerous_goods": true}'
[task.grader]
type = "json"
schema = '''
{"type": "object", "additionalProperties": false,
 "required": ["container", "weight_kg", "seals", "eta", "dangerous_goods"],
 "properties": {"container": {"type": "string"}, "weight_kg": {"type": "integer"},
                "seals": {"type": "array", "items": {"type": "string"}},
                "eta": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"},
                "dangerous_goods": {"type": "boolean"}}}
'''
expected = '''
{"container": "MSKU 448120-7", "weight_kg": 8482, "seals": ["B2210", "B2211"],
 "eta": "2026-05-31", "dangerous_goods": false}
'''
