# Reasoning and math: exact match on the final answer.
# `wrong` is the tempting mistake for each problem. Every key was checked by brute force.

[[task]]
id = "rsn-crates"
title = "One-step multiplication"
difficulty = 1
prompt = "A crate holds 24 bottles. How many bottles are there in 17 full crates?"
wrong = "ANSWER: 398"
[task.grader]
type = "exact"
expected = "408"

