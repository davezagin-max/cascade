[[task]]
id = "rsn-talk-schedule"
title = "Ordering puzzle with six constraints"
difficulty = 4
prompt = '''
Five talks, A, B, C, D and E, fill slots 1 to 5, one talk per slot.

- A is in an earlier slot than B.
- C is in the slot immediately after D.
- E is in neither slot 1 nor slot 5.
- B and C are not in adjacent slots.
- A is not in slot 1.
- E is in a later slot than A.

Which talk is in slot 3? Answer with a single letter.
'''
wrong = "ANSWER: E"
[task.grader]
type = "exact"
expected = "A"

