[[task]]
id = "cls-lock-race"
title = "Bug category in threaded code"
difficulty = 3
prompt = '''
Classify the bug in this class as one of: off_by_one, race_condition, null_dereference, resource_leak, integer_overflow. Many threads call `incr` at the same time and the counter must never exceed LIMIT.

```python
import threading

LIMIT = 100

class Counter:
    def __init__(self):
        self.n = 0
        self.lock = threading.Lock()

    def incr(self):
        if self.n < LIMIT:
            with self.lock:
                self.n += 1
```
'''
wrong = "ANSWER: off_by_one"
[task.grader]
type = "exact"
expected = "race_condition"
labels = ["off_by_one", "race_condition", "null_dereference", "resource_leak", "integer_overflow"]

[[task]]
id = "cls-log-leak"
title = "Sensitive data category in a log line"
difficulty = 4
prompt = '''
Which category of sensitive data does this log line leak? Use these definitions:

- credential: a password, API key, or session or bearer token.
- payment_card: a complete card number (13 to 19 digits).
- government_id: a complete national ID or passport number.
- email: a complete email address.
- none: none of the above.

If more than one applies, answer with the most severe, in this order: credential, payment_card, government_id, email, none.

Log line:
user=jsmith action=update_profile auth="Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiJ9.c2ln" note="card ending 4242 on file, passport check passed, contact via the address on record"
'''
wrong = "ANSWER: payment_card"
[task.grader]
type = "exact"
expected = "credential"
labels = ["credential", "payment_card", "government_id", "email", "none"]

[[task]]
id = "cls-expense-policy"
title = "Expense claim under a precedence policy"
difficulty = 4
prompt = '''
Apply this expense policy to the claim and answer with exactly one of: approve, needs_manager, needs_receipt, reject.

Policy for meals, per person per day:
1. Up to $60: approve.
2. More than $60 and up to $150: needs_manager.
3. More than $150: reject.
4. Any claim over $25 with no receipt attached is needs_receipt. This rule overrides rules 1 and 2, but a claim that rule 3 rejects is still rejected.

Claim: one dinner for one person, $142.00 including tip. The employee notes that the receipt was lost and attaches a card statement line instead.
'''
wrong = "ANSWER: needs_manager"
[task.grader]
type = "exact"
expected = "needs_receipt"
labels = ["approve", "needs_manager", "needs_receipt", "reject"]

[[task]]
