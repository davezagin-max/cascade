[[task]]
id = "cls-subscription-state"
title = "Subscription state on a given date"
difficulty = 5
prompt = '''
Work out the state of this subscription on the date given. Answer with active, grace_period, expired, or cancelled.

Rules:
- A subscription is active through its paid-through date, inclusive.
- If a cancellation was requested, it takes effect the day after the paid-through date. From then on the state is cancelled and no grace period applies.
- Otherwise, the 14 days after the paid-through date are a grace_period.
- After the grace period ends, the state is expired.
- A successful renewal payment moves the paid-through date forward by one month and withdraws any earlier cancellation request.

History:
- Paid through 2026-01-27.
- 2026-01-20: customer requests cancellation.
- 2026-01-25: renewal payment succeeds.
- 2026-03-05: today. No other events.
'''
wrong = "ANSWER: cancelled"
[task.grader]
type = "exact"
expected = "grace_period"
labels = ["active", "grace_period", "expired", "cancelled"]
