# Classification: exact match on one label from a fixed set.
# Labels are decided by rules stated in the prompt, never by taste, so the key is not arguable.

[[task]]
id = "cls-ticket-billing"
title = "Support ticket intent"
difficulty = 1
prompt = '''
Classify this support message as one of: billing, shipping, technical, account.

"Hi, I was charged twice for my March subscription. Can one of the charges be reversed?"
'''
wrong = "ANSWER: account"
[task.grader]
type = "exact"
expected = "billing"
labels = ["billing", "shipping", "technical", "account"]

