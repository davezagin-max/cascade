[[task]]
id = "cls-incident-severity"
title = "Incident severity from a rubric"
difficulty = 2
prompt = '''
Assign a severity to this incident using the definitions below. Answer with sev1, sev2, sev3, or sev4.

- sev1: a revenue-critical flow is down for all customers in at least one region.
- sev2: a revenue-critical flow is degraded, or down for only some customers.
- sev3: a non-critical feature is down or degraded.
- sev4: cosmetic issue, no functional impact.

Incident: "Since 09:14 UTC, checkout returns HTTP 500 for every customer in the EU region. US and APAC are unaffected. The marketing banner on the home page is also misaligned."
'''
wrong = "ANSWER: sev2"
[task.grader]
type = "exact"
expected = "sev1"
labels = ["sev1", "sev2", "sev3", "sev4"]

[[task]]
id = "cls-off-by-one"
title = "Bug category in a short function"
difficulty = 2
prompt = '''
Classify the bug in this function as one of: off_by_one, race_condition, null_dereference, resource_leak, integer_overflow.

```python
def last_k(items, k):
    """Return the last k items of the list."""
    return [items[i] for i in range(len(items) - k, len(items) + 1)]
```
'''
wrong = "ANSWER: null_dereference"
[task.grader]
type = "exact"
expected = "off_by_one"
labels = ["off_by_one", "race_condition", "null_dereference", "resource_leak", "integer_overflow"]

