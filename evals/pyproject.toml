[project]
name = "cascade-evals"
version = "0.1.0"
description = "Eval runner, graders, simulator, and router trainer for Cascade."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
]

[project.scripts]
cascade = "cascade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["cascade"]
ignore_missing_imports = true
check_untyped_defs = true
